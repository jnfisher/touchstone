name: tools
on:
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned so the oracle's float edge cases behave the same here as in agent sessions.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s tools -p 'test_*.py'
