name: oracle-check

# Manual only: regenerates every fixture family from MME's own code and fails if a committed
# fixture is stale. Never part of PR CI (docs/testing.md).
on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y mdbtools
      - name: Fetch MME source and the stock database
        run: |
          tools/mme-fetch.sh
          tools/mdb-fetch.sh
      - name: Oracle unit tests
        run: python3 -I -m unittest discover -s tools -p 'test_*.py'
      - name: Regenerate and diff the fixtures
        run: python3 -I tools/oracle/oracle.py check
