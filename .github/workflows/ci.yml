name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          # A manual run has no diff to filter, so it runs everything.
          predicate-quantifier: some
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'crates/**'
              - 'bin/**'
              - 'fixtures/**'
              - 'tools/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - '.github/workflows/**'

  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tools/guard.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    # Pinned to 24.04: the mdbtools fallback below names that release's packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The converted stock database the data tests read. The key is the pinned sha256 of the
      # source .mdb (see tools/mdb-fetch.sh); a miss installs mdbtools and converts it.
      - name: Stock database cache
        id: mdb
        uses: actions/cache@v4
        with:
          path: ~/.cache/touchstone/mdb
          key: stock-mdb-eba20f06af8dc08df755eb6dcd9763b023794f12e809cbab6762236d64d7345f
      - name: Convert the stock database
        if: steps.mdb.outputs.cache-hit != 'true'
        run: |
          # apt on the runner at times cannot resolve the Ubuntu mirrors for an hour or more. The
          # same three packages are then taken from another mirror and checked against their sha256.
          if ! sudo apt-get install -y --no-install-recommends mdbtools; then
            dir="$(mktemp -d)"
            base="https://mirrors.kernel.org/ubuntu/pool/universe/m/mdbtools"
            ver="1.0.0+dfsg-1.2ubuntu1_amd64"
            while read -r sum name; do
              curl -fsSL --retry 3 -o "$dir/$name.deb" "$base/${name}_$ver.deb"
              echo "$sum  $dir/$name.deb" | sha256sum -c -
            done <<'DEBS'
          c1572263501841288014a1d160645ad87093b3b8c9bd419645b03566e24b90e7 libmdb3t64
          5f8ecf104cf108d9af529978518c28eb0cce5f330603c54b93b5a30a6b5fc351 libmdbsql3t64
          b1abc8087ad327543b70f96b9a6eeb3f37154dd2d6040d6d170a9a14637e4be2 mdbtools
          DEBS
            sudo dpkg -i "$dir"/libmdb3t64.deb "$dir"/libmdbsql3t64.deb "$dir"/mdbtools.deb
          fi
          tools/mdb-fetch.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
